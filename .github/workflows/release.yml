name: release
# Publishes a GitHub release when a version tag such as v0.1.1 is pushed. See RELEASING.md.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write            # needed to create the release; nothing else in this repo is changed
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the version in the code
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "^__version__ = \"$v\"$" usblockbox/__init__.py || { echo "Tag $GITHUB_REF_NAME does not match __version__ in usblockbox/__init__.py"; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the tests
        run: |
          python -m pip install pytest reportlab
          python -m pytest -q
      - name: Build the zip and its SHA-256
        run: |
          v="${GITHUB_REF_NAME#v}"
          git archive --format=zip --prefix="usblockbox-$v/" -o "usblockbox-$v.zip" "$GITHUB_REF_NAME"
          sha256sum "usblockbox-$v.zip" > SHA256SUMS
          cat SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '/^## /{p = ($2 == v); next} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md for what changed." > notes.md
          cat notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          flag=""; case "$v" in *-*) flag="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" "usblockbox-$v.zip" SHA256SUMS \
            --title "USB Lockbox v$v" --notes-file notes.md $flag
